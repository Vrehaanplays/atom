const EVENTS = [

    for (let i = 0; i < 24; i++) {
      S.pickups.push({ x: rand(20, W - 20), y: -rand(20, 520), vy: rand(60, 160), drift: rand(-30, 30), emo: '💸', k: 'money', label: '', life: 10, dead: false });
    }

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hit = (a, b, pad = 0) =>
  Math.abs(a.x - b.x) < (a.w + b.w) / 2 + pad && Math.abs(a.y - b.y) < (a.h + b.h) / 2 + pad;
const level = () => 1 + Math.floor(S.kills / 12);
const mult = () => 1 + Math.min(4, Math.floor(S.combo / 3));

/* ---------- canvas ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.floor(W * s * dpr);
  canvas.height = Math.floor(H * s * dpr);
}
addEventListener('resize', resize);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(s, x, y, size, color = '#fff', align = 'center', font = FONT_HEAD, stroke = '#000') {
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size / 7);
    ctx.strokeStyle = stroke;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

function emoji(s, x, y, size, alpha = 1, rot = 0) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.font = `${size}px ${EMO_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, 0, 0);
  ctx.restore();
}

/* ---------- audio: tiny synth, zero files ---------- */
let AC = null, master = null, muted = false;
function ensureAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.3;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = 0.15, slide = 1) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, hp = 1200) {
  if (!AC || muted) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf;
  f.type = 'highpass'; f.frequency.value = hp;
  const t = AC.currentTime;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur);
}
const sfx = {
  shoot: () => tone(880, 0.07, 'square', 0.05, 0.4),
  hit:   () => noise(0.05, 0.1, 2000),
  kill:  () => tone(300, 0.18, 'triangle', 0.18, 2.5),
  hurt:  () => tone(160, 0.35, 'sawtooth', 0.16, 0.4),
  pick:  () => [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.14), i * 70)),
  mic:   () => { noise(0.12, 0.5, 400); tone(90, 0.3, 'sine', 0.6, 0.5); },
  siren: () => tone(500, 0.6, 'sawtooth', 0.07, 2),
};

/* 118 BPM, 16 steps. Kick, clap, hat, bass, and the occasional chipmunk. */
const STEP = 60 / 118 / 4;
const BASS = [55, 0, 55, 0, 65, 0, 55, 0, 49, 0, 49, 0, 73, 0, 65, 0];
let mClock = 0, mStep = 0;
function music(dt) {
  if (!AC || muted) { mClock = 0; return; }
  mClock += dt;
  while (mClock >= STEP) {
    mClock -= STEP;
    const i = mStep;
    mStep = (mStep + 1) % 16;
    if ([0, 6, 8, 11].includes(i)) tone(130, 0.3, 'sine', 0.8, 0.18);
    if (i === 4 || i === 12) noise(0.14, 0.16, 1500);
    if (i % 2 === 0) noise(i === 14 ? 0.08 : 0.03, 0.04, 7000);
    if (BASS[i]) tone(BASS[i], 0.18, 'sawtooth', 0.06);
    if (i === 15 && Math.random() < 0.35) tone(rand(900, 1600), 0.09, 'triangle', 0.07);
  }
}

/* ---------- game state ---------- */
const S = {};
let state = 'title'; // title | play | pause | over
let best = 0;
try { best = Number(localStorage.getItem('ye_best_hype')) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('ye_best_hype', String(best)); } catch (e) {} }

let wall = 0;            // real time, drives visuals only
let jumpBuf = 0;
let typed = '';
let useMouse = false, mouseFire = false;
let touchUI = matchMedia('(pointer: coarse)').matches;
const aim = { x: W / 2, y: GROUND - 80 };
const keys = {};
const held = { left: false, right: false, fire: false };
const ptrMap = new Map();
const BTN = {
  left:  { x: 80,      y: H - 130, r: 44, label: '◀' },
  right: { x: 180,     y: H - 130, r: 44, label: '▶' },
  jump:  { x: W - 180, y: H - 130, r: 44, label: '▲' },
  fire:  { x: W - 80,  y: H - 130, r: 44, emo: '👟' },
};
const TK = { x: W, text: '', w: 0 };

function reset() {
  S.p = { x: W / 2, y: GROUND - PH / 2, w: PW, h: PH, vx: 0, vy: 0, facing: 1, onGround: true, ego: 5, inv: 0, fireCD: 0 };
  S.enemies = []; S.bullets = []; S.eBullets = []; S.pickups = []; S.parts = []; S.texts = [];
  S.boss = null;
  S.kills = 0; S.score = 0; S.combo = 0; S.comboT = 0;
  S.spawnT = 1.2; S.eventT = 7; S.pickupT = 10; S.nextBoss = 25;
  S.banner = null; S.bannerT = 0; S.bannerDur = 1;
  S.flash = 0; S.stun = 0; S.shake = 0; S.shakeMag = 0; S.clay = 0;
  S.bigHead = 0; S.grav = 0; S.god = 0; S.storm = 0; S.brain = 0; S.moon = 0;
  S.time = 0; S.overT = 0; S.overLine = ''; S.newBest = false;
  S.aimAng = 0;
}

function banner(t, dur, color = '#fff') {
  S.banner = { t, color };
  S.bannerT = dur;
  S.bannerDur = dur;
}
function addText(s, x, y, color = '#fff', size = 20) {
  S.texts.push({ s, x, y, color, size, life: 1.1, vy: -50, dead: false });
}
function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(80, 320);
    S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: rand(0.4, 0.8), max: 0.8, color, size: rand(3, 7), dead: false });
  }
}
function shake(dur, mag) {
  S.shake = Math.max(S.shake, dur);
  S.shakeMag = Math.max(S.shakeMag, mag);
}
function sayTo(e, s, dur) { e.say = s; e.sayT = dur; }

function startGame() {
  ensureAudio();
  reset();
  state = 'play';
  banner(pick(['LET\'S GO', 'THE ALBUM IS THE MAN', 'THIS IS THE BEST GAME EVER MADE (ACCORDING TO ME)']), 2, '#fff');
  sfx.pick();
}
function gameOver() {
  if (state !== 'play') return;
  state = 'over';
  S.overT = 0;
  S.overLine = pick(OVER_LINES);
  S.newBest = S.score > 0 && S.score > best;
  if (S.score > best) { best = S.score; saveBest(); }
  sfx.hurt();
}
function togglePause() {
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}

/* ---------- input ---------- */
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function btnAt(pt) {
  for (const k in BTN) {
    const b = BTN[k];
    if (Math.hypot(pt.x - b.x, pt.y - b.y) <= b.r + 6) return k;
  }
  return null;
}
function aimDir() {
  const p = S.p;
  if (useMouse) {
    const dx = aim.x - p.x, dy = aim.y - p.y, L = Math.hypot(dx, dy);
    if (L > 30) return { x: dx / L, y: dy / L };
  }
  return { x: p.facing, y: 0 };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ensureAudio();
  const pt = toLogical(e);
  aim.x = pt.x; aim.y = pt.y;
  if (e.pointerType === 'touch') touchUI = true;
  useMouse = e.pointerType !== 'touch';
  canvas.setPointerCapture(e.pointerId);

  if (state === 'title' || (state === 'over' && S.overT > 0.8)) { startGame(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (state !== 'play') return;

  const b = touchUI ? btnAt(pt) : null;
  if (b === 'jump') { jumpBuf = 0.14; ptrMap.set(e.pointerId, null); return; }
  if (b) { held[b] = true; ptrMap.set(e.pointerId, b); return; }
  mouseFire = true;
  ptrMap.set(e.pointerId, '__play');
});
canvas.addEventListener('pointermove', (e) => {
  const pt = toLogical(e);
  aim.x = pt.x; aim.y = pt.y;
  if (e.pointerType === 'mouse') useMouse = true;
});
const pointerEnd = (e) => {
  const k = ptrMap.get(e.pointerId);
  ptrMap.delete(e.pointerId);
  if (k && k !== '__play') held[k] = false;
  if (k === '__play') mouseFire = false;
};
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);

addEventListener('keydown', (e) => {
  ensureAudio();
  const k = e.key.toLowerCase();
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (e.repeat) return;
  keys[k] = true;
  if (['a', 'd', 'arrowleft', 'arrowright'].includes(k)) useMouse = false;
  if (k === ' ' || k === 'w' || k === 'arrowup') jumpBuf = 0.14;
  if (k === 'enter' || k === ' ') {
    if (state === 'title' || (state === 'over' && S.overT > 0.8)) startGame();
  }
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'm') muted = !muted;
  if (/^[a-z]$/.test(k) && state === 'play') {
    typed = (typed + k.toUpperCase()).slice(-12);
    for (const [word, fn] of CHEATS) {
      if (typed.endsWith(word)) { typed = ''; fn(); break; }
    }
  }
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state === 'play') state = 'pause';
});

/* ---------- spawning ---------- */
function mkEnemy(o) {
  return Object.assign({
    kind: '', emo: '❓', x: 0, y: 0, vx: 0, vy: 0, w: 40, h: 40, size: 44,
    hp: 1, maxhp: 1, score: 100, t: 0, flash: 0,
    say: null, sayT: 0, onGround: false, dead: false,
    fireT: 2, blink: 1.5, baseX: 0, baseY: 0,
  }, o);
}
function spawnHater(fromLeft) {
  const e = mkEnemy({ kind: 'hater', emo: '😤', x: fromLeft ? -30 : W + 30, y: GROUND - 25, w: 44, h: 50, size: 50, score: 100 });
  if (Math.random() < 0.6) sayTo(e, pick(INSULTS), 2.4);
  S.enemies.push(e);
}
function spawnEnemy() {
  const lvl = level();
  const opts = [['hater', 6]];
  if (lvl >= 2) opts.push(['duck', 2], ['paps', 1.6]);
  if (lvl >= 3) opts.push(['tax', 1.8]);
  if (lvl >= 4) opts.push(['critic', 1.1]);
  let r = Math.random() * opts.reduce((a, o) => a + o[1], 0), kind = 'hater';
  for (const [k, w] of opts) { r -= w; if (r < 0) { kind = k; break; } }

  const fromLeft = Math.random() < 0.5;
  const dir = fromLeft ? 1 : -1;
  const sx = fromLeft ? -40 : W + 40;

  if (kind === 'hater') { spawnHater(fromLeft); return; }
  if (kind === 'duck') {
    const e = mkEnemy({ kind, emo: '🦆', x: sx, y: 200, baseY: rand(150, 300), w: 46, h: 40, size: 42, score: 150, vx: dir * rand(150, 200) * (1 + lvl * 0.04) });
    e.y = e.baseY;
    if (Math.random() < 0.5) sayTo(e, pick(['QUACK', 'QUACK (WHY)', 'I AM A DUCK (ALLEGEDLY)']), 2);
    S.enemies.push(e);
  } else if (kind === 'paps') {
    const y = rand(70, 140);
    S.enemies.push(mkEnemy({ kind, emo: '📸', x: sx, y, baseY: y, w: 50, h: 40, size: 44, score: 200, vx: dir * rand(170, 230) }));
  } else if (kind === 'tax') {
    const x = rand(80, W - 80);
    const e = mkEnemy({ kind, emo: '🧾', x, y: -40, baseX: x, vy: rand(120, 170) + lvl * 8, w: 36, h: 44, size: 40, score: 175 });
    sayTo(e, 'PAYMENT DUE', 2);
    S.enemies.push(e);
  } else if (kind === 'critic') {
    const e = mkEnemy({ kind, emo: '🧐', x: fromLeft ? 110 : W - 110, y: GROUND - 35, w: 56, h: 70, size: 64, hp: 3, maxhp: 3, score: 300, fireT: 1.2 });
    S.enemies.push(e);
  }
}
function spawnBoss() {
  const hp = 40 + level() * 12;
  const b = mkEnemy({ kind: 'boss', emo: '🧐', x: W / 2, y: 150, baseY: 150, w: 150, h: 150, size: 130, hp, maxhp: hp, score: 2000, fireT: 1.5, spawnT: 2.5 });
  S.boss = b;
  S.enemies.push(b);
  sayTo(b, 'I have reviewed everything. Including you.', 3.5);
  banner('MEGA CRITIC HAS ENTERED THE CHAT', 3, '#ffd60a');
  sfx.siren();
}
function spawnPickup(x, y, def, vy = -320) {
  const d = def || pick(POWER);
  S.pickups.push({ x, y, vy, drift: 0, emo: d.emo, k: d.k, label: d.label, life: 10, dead: false });
}
function shootHotTake(x, y, speed, spread = 0) {
  const p = S.p;
  const a = Math.atan2(p.y - y, p.x - x) + spread;
  S.eBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 6, spin: 0, dead: false });
}

/* ---------- enemy AI ---------- */
function updateBoss(b, dt, fz) {
  b.t += dt;
  b.x = W / 2 + Math.sin(b.t * 0.6) * (W / 2 - 130);
  b.y = b.baseY + Math.sin(b.t * 1.5) * 16;
  b.fireT -= dt * fz;
  if (b.fireT <= 0) {
    b.fireT = Math.max(0.9, 1.6 - level() * 0.07);
    const n = 3 + Math.min(2, Math.floor(level() / 3));
    for (let i = 0; i < n; i++) shootHotTake(b.x, b.y + 40, 230, (i - (n - 1) / 2) * 0.28);
    sayTo(b, pick(BOSS_LINES), 2.6);
  }
  b.spawnT -= dt * fz;
  if (b.spawnT <= 0) { b.spawnT = 4.2; spawnHater(Math.random() < 0.5); }
}
function updateEnemies(dt) {
  const p = S.p, lvl = level();
  for (const e of S.enemies) {
    if (e.dead) continue;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.sayT > 0) { e.sayT -= dt; if (e.sayT <= 0) e.say = null; }
    const fz = S.stun > 0 ? 0 : 1;

    if (e.kind === 'hater') {
      const dir = Math.sign(p.x - e.x) || 1;
      e.vx += (dir * (70 + lvl * 9) * fz - e.vx) * Math.min(1, dt * 4);
      if (e.onGround && fz && Math.random() < dt * 0.8) { e.vy = -560; e.onGround = false; }
      e.vy += GRAV * dt;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      if (e.y + e.h / 2 >= GROUND) { e.y = GROUND - e.h / 2; e.vy = 0; e.onGround = true; }
    } else if (e.kind === 'duck') {
      e.x += e.vx * dt * fz;
      e.y = e.baseY + Math.sin(e.t * 3) * 38;
      if (e.x < -100 || e.x > W + 100) e.dead = true;
    } else if (e.kind === 'paps') {
      e.x += e.vx * dt * fz;
      e.y = e.baseY + Math.sin(e.t * 1.3) * 10;
      e.blink -= dt;
      if (e.blink <= 0) { e.blink = 2.2; S.flash = 0.22; sfx.hit(); }
      if (e.x < -100 || e.x > W + 100) e.dead = true;
    } else if (e.kind === 'tax') {
      e.y += e.vy * dt * fz;
      e.x = e.baseX + Math.sin(e.t * 2.4) * 60;
      if (e.y > GROUND) e.dead = true;
    } else if (e.kind === 'critic') {
      e.fireT -= dt * fz;
      if (e.fireT <= 0) {
        e.fireT = 2.2;
        shootHotTake(e.x, e.y - 10, 260, 0);
        if (Math.random() < 0.5) sayTo(e, pick(CRITIC_LINES), 1.6);
      }
    } else if (e.kind === 'boss') {
      updateBoss(e, dt, fz);
    }
  }
}

/* ---------- kills, pickups, damage ---------- */
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true; e.hp = 0;
  S.kills++;
  S.combo++; S.comboT = 2.6;
  const pts = Math.round(e.score * mult() * (S.brain > 0 ? 2 : 1));
  S.score += pts;
  addText('+' + pts, e.x, e.y - 30, '#ffd60a', 22);
  burst(e.x, e.y, e.kind === 'boss' ? '#ff3cac' : '#ff9f1c', e.kind === 'boss' ? 60 : 14);
  sfx.kill();
  if (Math.random() < 0.3) addText(pick(KILL_QUIPS), e.x, e.y - 58, '#fff', 16);
  if (Math.random() < 0.15) spawnPickup(e.x, e.y);
  if (e.kind === 'boss') {
    S.boss = null;
    S.nextBoss = S.kills + 30;
    banner('MEGA CRITIC HAS BEEN CANCELLED (BY HIMSELF, HE IS FINE)', 3.5, '#ffd60a');
    shake(0.8, 16);
    for (let i = 0; i < 3; i++) spawnPickup(e.x + rand(-90, 90), e.y - 20);
  }
}
function collect(pu) {
  const p = S.p;
  switch (pu.k) {
    case 'mic':
      sfx.mic();
      for (const e of S.enemies) {
        if (e.dead) continue;
        if (e.kind === 'boss') { e.hp -= 6; e.flash = 0.3; if (e.hp <= 0) killEnemy(e); }
        else killEnemy(e);
      }
      banner('MIC DROP. NO QUESTIONS.', 2.2, '#fff');
      shake(0.4, 14);
      burst(p.x, p.y, '#fff', 30);
      break;
    case 'choir':
      p.ego = Math.min(5, p.ego + 1);
      banner('SUNDAY SERVICE. EVERYBODY SING (BADLY).', 2.2, '#7bd389');
      burst(p.x, p.y, '#7bd389', 30);
      addText('+1 EGO', p.x, p.y - 50, '#7bd389', 22);
      sfx.pick();
      break;
    case 'storm': S.storm = 7; banner('SNEAKER STORM. ALL SHOES. ALL OF THEM.', 2.2, '#ff9f1c'); sfx.pick(); break;
    case 'brain': S.brain = 9; banner('BIG BRAIN ENGAGED. 2X HYPE.', 2.2, '#c084fc'); sfx.pick(); break;
    case 'moon':  S.moon = 7; banner('MOON MODE. LOW GRAVITY. HIGH EXPECTATIONS.', 2.4, '#93c5fd'); sfx.pick(); break;
    case 'album':
      S.score += 500;
      banner('NEW ALBUM. NO TRACKLIST. (ON PURPOSE)', 2.6, '#ffd60a');
      addText('+500', p.x, p.y - 50, '#ffd60a', 24);
      sfx.pick();
      break;
    case 'money': {
      const v = Math.round(25 * mult() * (S.brain > 0 ? 2 : 1));
      S.score += v;
      addText('+' + v, pu.x, pu.y - 10, '#86efac', 16);
      break;
    }
  }
}
function hurt(srcX, msg) {
  const p = S.p;
  if (state !== 'play' || p.inv > 0 || S.god > 0) return;
  p.ego -= 1;
  p.inv = 1.4;
  p.vx = (p.x >= srcX ? 1 : -1) * 340;
  p.vy = -300;
  p.onGround = false;
  shake(0.25, 9);
  sfx.hurt();
  burst(p.x, p.y, '#ff4d6d', 14);
  addText(msg, p.x, p.y - 60, '#ff6b8b', 18);
  S.combo = 0; S.comboT = 0;
  if (p.ego <= 0) gameOver();
}
const EVENT_FN = () => pick(EVENTS)();

/* ---------- update ---------- */
function update(dt) {
  const p = S.p;
  S.time += dt;
  for (const k of ['flash', 'stun', 'shake', 'clay', 'bigHead', 'grav', 'god', 'storm', 'brain', 'moon', 'comboT', 'bannerT']) {
    if (S[k] > 0) S[k] -= dt;
  }
  if (S.shake <= 0) S.shakeMag = 0;
  if (S.comboT <= 0) S.combo = 0;
  const gm = (S.grav > 0 ? 0.4 : 1) * (S.moon > 0 ? 0.55 : 1);

  /* player movement */
  const mL = keys.a || keys.arrowleft || held.left;
  const mR = keys.d || keys.arrowright || held.right;
  const ax = (mR ? 1 : 0) - (mL ? 1 : 0);
  if (ax) p.facing = ax;
  p.vx += (ax * RUN - p.vx) * Math.min(1, dt * (p.onGround ? 16 : 5));
  jumpBuf = Math.max(0, jumpBuf - dt);
  if (jumpBuf > 0 && p.onGround) {
    p.vy = JUMP_V; p.onGround = false; jumpBuf = 0;
    tone(420, 0.1, 'square', 0.07, 2);
  }
  const prevBottom = p.y + PH / 2;
  p.vy += GRAV * gm * dt;
  p.x = clamp(p.x + p.vx * dt, PW / 2, W - PW / 2);
  p.y += p.vy * dt;
  p.onGround = false;
  if (p.y + PH / 2 >= GROUND) { p.y = GROUND - PH / 2; p.vy = 0; p.onGround = true; }
  if (p.vy >= 0) {
    for (const pl of PLATS) {
      if (prevBottom <= pl.y + 2 && p.y + PH / 2 >= pl.y && p.x + PW / 2 > pl.x0 && p.x - PW / 2 < pl.x1) {
        p.y = pl.y - PH / 2; p.vy = 0; p.onGround = true; break;
      }
    }
  }
  if (p.y - PH / 2 < 0) { p.y = PH / 2; p.vy = Math.max(0, p.vy); }

  /* aim + fire */
  const d = aimDir();
  S.aimAng = Math.atan2(d.y, d.x);
  if (useMouse && Math.abs(d.x) > 0.25) p.facing = d.x > 0 ? 1 : -1;
  p.fireCD -= dt;
  const wantFire = keys.j || keys.x || keys.k || keys.z || held.fire || mouseFire;
  if (wantFire && p.fireCD <= 0) {
    p.fireCD = S.storm > 0 ? 0.075 : 0.22;
    const spread = S.storm > 0 ? [-0.2, 0, 0.2] : [0];
    for (const s of spread) {
      const c = Math.cos(s), sn = Math.sin(s);
      const dx = d.x * c - d.y * sn, dy = d.x * sn + d.y * c;
      S.bullets.push({ x: p.x + dx * 26, y: p.y + dy * 26, vx: dx * 780, vy: dy * 780, spin: rand(0, 6), life: 1.6, dead: false });
    }
    sfx.shoot();
  }

  /* bullets */
  for (const b of S.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.spin += dt * 14; b.life -= dt;
    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > GROUND + 10) b.dead = true;
  }

  /* spawning */
  if (!S.boss) {
    S.spawnT -= dt;
    if (S.spawnT <= 0) {
      const alive = S.enemies.reduce((n, e) => n + (e.dead ? 0 : 1), 0);
      if (alive < 3 + level() * 2) spawnEnemy();
      S.spawnT = Math.max(0.5, 2.3 - level() * 0.16) * rand(0.7, 1.25);
    }
    if (S.kills >= S.nextBoss) spawnBoss();
  }
  S.eventT -= dt;
  if (S.eventT <= 0) { S.eventT = rand(9, 15); EVENT_FN(); }
  S.pickupT -= dt;
  if (S.pickupT <= 0) { S.pickupT = rand(12, 18); spawnPickup(rand(100, W - 100), -20, null, 60); }

  updateEnemies(dt);

  /* player vs enemies (stomp the haters, eat the rest) */
  for (const e of S.enemies) {
    if (e.dead || !hit(p, e, -6)) continue;
    if (e.kind !== 'boss' && p.vy > 0 && prevBottom <= e.y - e.h / 2 + 16) {
      killEnemy(e);
      p.vy = -520;
      p.onGround = false;
      continue;
    }
    hurt(e.x, pick(HURT_QUIPS));
  }

  /* bullets vs enemies */
  for (const b of S.bullets) {
    if (b.dead) continue;
    for (const e of S.enemies) {
      if (e.dead) continue;
      if (Math.abs(b.x - e.x) < e.w / 2 + 6 && Math.abs(b.y - e.y) < e.h / 2 + 6) {
        b.dead = true;
        e.hp -= 1;
        e.flash = 0.12;
        burst(b.x, b.y, '#ffd60a', 5);
        sfx.hit();
        if (e.hp <= 0) killEnemy(e);
        break;
      }
    }
  }

  /* hot takes */
  for (const b of S.eBullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.spin += dt * 6; b.life -= dt;
    if (b.life <= 0 || b.x < -60 || b.x > W + 60 || b.y > GROUND + 40 || b.y < -60) b.dead = true;
    else if (Math.hypot(b.x - p.x, b.y - p.y) < 24) { b.dead = true; hurt(b.x, pick(HURT_QUIPS)); }
  }

  /* pickups */
  for (const pu of S.pickups) {
    pu.life -= dt;
    pu.vy += 620 * dt;
    pu.y += pu.vy * dt;
    pu.x = clamp(pu.x + (pu.drift || 0) * dt, 20, W - 20);
    if (pu.y >= GROUND - 16) { pu.y = GROUND - 16; pu.vy = 0; }
    if (pu.life <= 0) pu.dead = true;
    if (!pu.dead && Math.hypot(pu.x - p.x, pu.y - p.y) < 38) { pu.dead = true; collect(pu); }
  }

  /* particles + floating text */
  for (const q of S.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 520 * dt; q.life -= dt; if (q.life <= 0) q.dead = true; }
  for (const t of S.texts) { t.y += t.vy * dt; t.life -= dt; if (t.life <= 0) t.dead = true; }

  /* cleanup */
  S.enemies = S.enemies.filter(e => !e.dead);
  S.bullets = S.bullets.filter(b => !b.dead);
  S.eBullets = S.eBullets.filter(b => !b.dead);
  S.pickups = S.pickups.filter(q => !q.dead);
  S.parts = S.parts.filter(q => !q.dead);
  S.texts = S.texts.filter(q => !q.dead);
}

/* ---------- drawing: world ---------- */
function drawBG() {
  const hue = (level() * 28) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, `hsl(${(265 + hue) % 360} 70% 10%)`);
  g.addColorStop(0.55, `hsl(${(300 + hue) % 360} 80% 28%)`);
  g.addColorStop(1, `hsl(${(15 + hue) % 360} 95% 55%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 40; i++) ctx.fillRect((i * 197) % W, (i * 131) % 230, 2, 2);

  // sun with retro stripes
  const sx = W / 2, sy = GROUND - 150;
  const sg = ctx.createLinearGradient(0, sy - 120, 0, sy + 120);
  sg.addColorStop(0, '#fff27a'); sg.addColorStop(0.5, '#ff8a3d'); sg.addColorStop(1, '#ff2e88');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 120, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `hsl(${(300 + hue) % 360} 80% 22%)`;
  for (let i = 0; i < 6; i++) ctx.fillRect(sx - 130, sy + 10 + i * i * 4, 260, 2 + i * 0.8);

  // drifting clouds
  for (let i = 0; i < 5; i++) {
    const x = ((i * 260 + wall * 20) % (W + 200)) - 100;
    emoji('☁️', x, 110 + (i % 2) * 60, 60, 0.25);
  }

  // ground + scrolling perspective grid
  ctx.fillStyle = '#0c0614';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = 'rgba(255,60,172,0.45)';
  ctx.lineWidth = 1.5;
  const off = (wall * 0.5) % 1;
  ctx.beginPath();
  for (let k = 0; k <= 9; k++) {
    const f = (k + off) / 9;
    const y = GROUND + f * f * (H - GROUND);
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  for (let i = -10; i <= 10; i++) { ctx.moveTo(W / 2, GROUND); ctx.lineTo(W / 2 + i * 140, H); }
  ctx.stroke();
  ctx.fillStyle = '#ffd60a';
  ctx.fillRect(0, GROUND - 2, W, 3);
}
function drawPlats() {
  for (const pl of PLATS) {
    const w = pl.x1 - pl.x0;
    ctx.fillStyle = '#2b1b3d';
    rr(pl.x0, pl.y, w, 14, 5); ctx.fill();
    ctx.fillStyle = '#ffd60a';
    ctx.fillRect(pl.x0 + 6, pl.y + 10, w - 12, 3);
    emoji('👟', (pl.x0 + pl.x1) / 2, pl.y - 12, 22);
  }
}
function drawPickups() {
  for (const pu of S.pickups) {
    const bob = Math.sin(wall * 4 + pu.x) * 3;
    emoji(pu.emo, pu.x, pu.y + bob, pu.k === 'money' ? 24 : 32);
    if (pu.label) text(pu.label, pu.x, pu.y - 28, 12, '#fff', 'center', FONT_BODY, '#000');
  }
}
function drawBubble(s, x, y) {
  ctx.font = `13px ${FONT_BODY}`;
  const w = Math.min(340, ctx.measureText(s).width + 22), h = 24;
  const bx = clamp(x - w / 2, 6, W - w - 6);
  const by = clamp(y - h / 2, 6, GROUND - h - 6);
  ctx.fillStyle = '#fff';
  rr(bx, by, w, h, 9); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, bx + w / 2, by + h / 2, w - 12);
}
function drawEnemies() {
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.kind === 'boss') {
      const g = ctx.createRadialGradient(e.x, e.y, 20, e.x, e.y, 110);
      g.addColorStop(0, 'rgba(255,60,172,0.55)');
      g.addColorStop(1, 'rgba(255,60,172,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, 110, 0, Math.PI * 2); ctx.fill();
    }
    const wob = e.kind === 'hater' && e.onGround ? Math.sin(e.t * 14) * 0.18 : 0;
    emoji(e.emo, e.x, e.y, e.size, e.flash > 0 ? 0.5 : 1, wob);
    if (e.maxhp > 1 && e.kind !== 'boss') {
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x - 18, e.y - e.h / 2 - 10, 36, 5);
      ctx.fillStyle = '#ff3cac';
      ctx.fillRect(e.x - 18, e.y - e.h / 2 - 10, 36 * clamp(e.hp / e.maxhp, 0, 1), 5);
    }
    if (e.say) {
      const by = e.kind === 'boss' ? e.y + e.h / 2 + 18 : e.y - e.h / 2 - 26;
      drawBubble(e.say, e.x, by);

}
function drawBullets() {
  for (const b of S.bullets) emoji('👟', b.x, b.y, 26, 1, b.spin);
  for (const b of S.eBullets) emoji('🌶️', b.x, b.y, 26, 1, b.spin);
}
function drawPlayer() {
  const p = S.p;
  if (p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0) return; // i-frame blink
  ctx.save();
  ctx.translate(p.x, p.y);

  if (S.god > 0) {
    const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 62);
    g.addColorStop(0, 'rgba(255,215,0,0.55)');
    g.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.fill();
  }

  const run = p.onGround && Math.abs(p.vx) > 40 ? Math.sin(wall * 18) * 6 : 0;
  // legs + shoes
  ctx.fillStyle = '#17171d';
  ctx.fillRect(-9, 8, 8, 18 + run);
  ctx.fillRect(1, 8, 8, 18 - run);
  ctx.fillStyle = '#f2ead3';
  rr(-12, 24 + run, 13, 6, 3); ctx.fill();

  ctx.lineCap = 'butt';
  // head (big head mode scales it)

  ctx.scale(hs, hs);
  ctx.fillStyle = '#8d5a33';
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(0, -2, 12.5, Math.PI, 0); ctx.fill();
  ctx.fillRect(-12.5, -3, 25, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(-9, -1, 8, 5); ctx.fillRect(1, -1, 8, 5); ctx.fillRect(-1, 0, 2, 2);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(-8, 0, 2, 1); ctx.fillRect(2, 0, 2, 1);
  ctx.strokeStyle = '#2a140a';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-3, 6); ctx.lineTo(3, 6); ctx.stroke();
  ctx.restore();
  // the weapon is a sneaker
  emoji('👟', hx, hy, 22);
  ctx.restore();
}
function drawParts() {
  for (const q of S.parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);

    ctx.fillRect(q.x, q.y, q.size, q.size);

  ctx.globalAlpha = 1;

}

}
function drawBanner() {
  if (!S.banner || S.bannerT <= 0) return;
  ctx.globalAlpha = Math.min(1, S.bannerT * 2.5);
  text(S.banner.t, W / 2, 150, 28, S.banner.color);
  ctx.globalAlpha = 1;
}
function newTicker() {
  TK.text = pick(HEADLINES) + '      ✦      ' + pick(HEADLINES) + '      ✦      ';
  ctx.font = `15px ${FONT_BODY}`;
  TK.w = ctx.measureText(TK.text).width;
  TK.x = W;
}
function drawTicker() {
  ctx.fillStyle = '#ffd60a';
  ctx.fillRect(0, H - 24, W, 24);
  ctx.fillStyle = '#000';
  ctx.font = `15px ${FONT_BODY}`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(TK.text, TK.x, H - 12);
}
function drawButtons() {
  for (const k in BTN) {
    const b = BTN[k];
    const on = held[k] || (k === 'fire' && mouseFire);
    ctx.globalAlpha = on ? 0.55 : 0.28;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (b.emo) emoji(b.emo, b.x, b.y, 34);
    else text(b.label, b.x, b.y, 30, '#000', 'center', FONT_BODY, null);
  }
}
function drawTitle() {
  drawBG();
  const sym = ['👟', '🦆', '🌶️', '💿', '👑', '🎤', '🧐', '📸'];
  for (let i = 0; i < 12; i++) {
    const x = ((i * 157 + wall * (18 + (i % 4) * 9)) % (W + 120)) - 60;
    const y = 40 + ((i * 97) % 380);
    emoji(sym[i % sym.length], x, y + Math.sin(wall * 1.5 + i) * 14, 34, 0.55, Math.sin(wall + i) * 0.4);
  }
  const g = ctx.createLinearGradient(0, 80, 0, 230);
  g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ff7ad9'); g.addColorStop(1, '#7c3aed');
  ctx.save();
  ctx.translate(W / 2, 165);
  ctx.rotate(Math.sin(wall * 1.2) * 0.04);
  text('YE', 0, 0, 150, g, 'center', FONT_HEAD, '#000');
  ctx.restore();
  text('THE UNOFFICIAL GAME', W / 2, 250, 34, '#fff', 'center', FONT_HEAD, '#ff3cac');
  text(SUBTITLES[Math.floor(wall / 3) % SUBTITLES.length], W / 2, 288, 18, '#7ff6ff', 'center', FONT_BODY, '#000');

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(W / 2 - 290, 318, 580, 132, 16); ctx.fill();
  const lines = [
    'A / D  or  ← →          MOVE (STYLISHLY)',
    'W / SPACE / ↑            JUMP  (STOMP THE HATERS)',
    'J / X / Z  or  CLICK     SHOOT SNEAKERS',
    'P / ESC  PAUSE     ·     M  MUTE',
  ];
  lines.forEach((l, i) => text(l, W / 2, 344 + i * 28, 16, '#fff', 'center', FONT_BODY, null));

  if (Math.floor(wall * 2) % 2 === 0) text('PRESS ENTER / SPACE / CLICK TO BEGIN', W / 2, 482, 24, '#ffd60a', 'center', FONT_HEAD, '#000');
  text(`BEST HYPE: ${best}`, W / 2, 514, 16, '#ccc', 'center', FONT_BODY, null);
  text('unofficial fan parody. not endorsed by anyone involved. the sneakers are fictional.', W / 2, 556, 12, '#bbb', 'center', FONT_BODY, null);
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, 260, 72, '#fff', 'center', FONT_HEAD, '#ff3cac');
  text('TAKING A 40 MINUTE BREAK. (THIS IS A MOVE.)', W / 2, 320, 20, '#ffd60a', 'center', FONT_BODY, '#000');
  text('PRESS P OR ESC TO RETURN', W / 2, 370, 18, '#fff', 'center', FONT_BODY, null);
}
function drawOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  text('GAME OVER', W / 2, 170, 84, '#ff3cac', 'center', FONT_HEAD, '#000');
  text(S.overLine, W / 2, 236, 22, '#ffd60a', 'center', FONT_BODY, '#000');
  text(`HYPE ${S.score}   ·   KILLS ${S.kills}   ·   WAVE ${level()}`, W / 2, 292, 22, '#fff', 'center', FONT_BODY, '#000');
  if (S.newBest) text('NEW PERSONAL BEST (THE SEQUEL)', W / 2, 332, 20, '#7bd389', 'center', FONT_BODY, '#000');
  if (S.overT > 0.8 && Math.floor(wall * 2) % 2 === 0) text('PRESS ENTER TO RUN IT BACK', W / 2, 420, 24, '#fff', 'center', FONT_HEAD, '#000');
}

function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.globalAlpha = 1;
  if (state === 'title') { drawTitle(); drawTicker(); return; }

  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shakeMag, S.shakeMag), rand(-S.shakeMag, S.shakeMag));
  if (S.clay > 0) {
    const s = Math.sin(wall * 5) * 0.035;
    ctx.translate(W / 2, H / 2); ctx.scale(1 + s, 1 - s); ctx.translate(-W / 2, -H / 2);
  }
  drawBG();
  drawPlats();
  drawPickups();
  drawEnemies();
  drawBullets();
  drawPlayer();
  drawParts();
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, S.flash * 1.6)})`;
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }
  ctx.restore();

  drawHUD();
  drawBanner();
  drawTicker();
  if (touchUI && state === 'play') drawButtons();
  if (state === 'pause') drawPause();
  if (state === 'over') drawOver();
}

/* ---------- main loop ---------- */
let lastTs = performance.now();
function frame(ts) {
  const dt = Math.min(0.033, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  wall += dt;
  if (state === 'play') update(dt);
  if (state === 'over') S.overT += dt;
  if (state !== 'pause') { TK.x -= 80 * dt; if (TK.x < -TK.w) newTicker(); }
  if (state === 'title' || state === 'play') music(dt); else mClock = 0;
  render();
  requestAnimationFrame(frame);
}

resize();
reset();
newTicker();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
